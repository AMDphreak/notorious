name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triplet: windows-x64
          - os: windows-11-arm
            triplet: windows-arm64
          - os: ubuntu-latest
            triplet: linux-x64
          - os: ubuntu-24.04-arm
            triplet: linux-arm64
          - os: macos-14
            triplet: macos-arm64
    runs-on: ${{ matrix.os }}
    # Windows ARM may fail (runner quirks); still publish successful slices.
    continue-on-error: ${{ matrix.triplet == 'windows-arm64' }}
    defaults:
      run:
        working-directory: github.com/AMDphreak/notorious
    steps:
      - uses: actions/checkout@v4
        with:
          path: github.com/AMDphreak/notorious
      - uses: actions/checkout@v4
        with:
          repository: dlang-supplemental/dew
          path: github.com/dlang-supplemental/dew
      - uses: actions/checkout@v4
        with:
          repository: dlang-supplemental/dui
          path: github.com/dlang-supplemental/dui
      - uses: actions/checkout@v4
        with:
          repository: dlang-supplemental/vello-d
          path: github.com/dlang-supplemental/vello-d
      - uses: actions/checkout@v4
        with:
          repository: AMDphreak/glfw-d
          path: github.com/dlang-supplemental/glfw-d
      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest
      # vello-d preBuild runs cargo build --release for the GPU bridge.
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux window system deps (GLFW)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Stamp version from tag
        shell: bash
        run: echo "${GITHUB_REF_NAME#v}" > VERSION
      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          BRIDGE_ROOT="../../dlang-supplemental/vello-d/vello_bridge"
          cargo build --release --manifest-path "$BRIDGE_ROOT/Cargo.toml"
          # Native absolute path (MSVC rejects Git Bash /d/... paths).
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            VELLO_BRIDGE_DIR="$(cd "$BRIDGE_ROOT/target/release" && pwd -W)"
            export VELLO_BRIDGE_DIR
            # Prefer the cdylib import lib — staticlib pulls many extra NT/userenv deps.
            export DFLAGS="-L=${VELLO_BRIDGE_DIR}/vello_bridge.dll.lib"
            cp "${VELLO_BRIDGE_DIR}/vello_bridge.dll" .
          else
            VELLO_BRIDGE_DIR="$(cd "$BRIDGE_ROOT/target/release" && pwd)"
            export VELLO_BRIDGE_DIR
            export DFLAGS="-L=${VELLO_BRIDGE_DIR}/libvello_bridge.a"
          fi
          echo "VELLO_BRIDGE_DIR=$VELLO_BRIDGE_DIR" >> "$GITHUB_ENV"
          echo "VELLO_BRIDGE_DIR=$VELLO_BRIDGE_DIR"
          echo "DFLAGS=$DFLAGS"
          ls -la "$VELLO_BRIDGE_DIR" | head -20
          dub build -c windowed --compiler=ldc2 --build=release
      - name: Stage slice
        shell: bash
        run: |
          mkdir -p "out/${{ matrix.triplet }}"
          if [ -f notorious.exe ]; then
            cp notorious.exe "out/${{ matrix.triplet }}/notorious.exe"
            cp notorious.exe "out/${{ matrix.triplet }}/app.exe"
            # Ship bridge DLL if the link used the import lib / cdylib.
            if [ -f "${VELLO_BRIDGE_DIR:-}/vello_bridge.dll" ]; then
              cp "${VELLO_BRIDGE_DIR}/vello_bridge.dll" "out/${{ matrix.triplet }}/"
            elif [ -f ../../dlang-supplemental/vello-d/vello_bridge/target/release/vello_bridge.dll ]; then
              cp ../../dlang-supplemental/vello-d/vello_bridge/target/release/vello_bridge.dll "out/${{ matrix.triplet }}/"
            fi
          else
            cp notorious "out/${{ matrix.triplet }}/notorious"
            cp notorious "out/${{ matrix.triplet }}/app"
            chmod +x "out/${{ matrix.triplet }}/app" "out/${{ matrix.triplet }}/notorious"
          fi
          cp LICENSE README.adoc "out/${{ matrix.triplet }}/" || true
      - name: Windows installer (Inno)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = (Get-Content VERSION -Raw).Trim()
          $archAllowed = if ('${{ matrix.triplet }}' -eq 'windows-arm64') { 'arm64' } else { 'x64compatible' }
          $dll = Join-Path $env:VELLO_BRIDGE_DIR 'vello_bridge.dll'
          if (-not (Test-Path $dll)) {
            $dll = '..\..\dlang-supplemental\vello-d\vello_bridge\target\release\vello_bridge.dll'
          }
          if (Test-Path $dll) { Copy-Item $dll . -Force }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$ver" `
            "/DMyArch=${{ matrix.triplet }}" `
            "/DMyArchAllowed=$archAllowed" `
            installer\notorious.iss
          if (-not (Test-Path dist\*-setup.exe)) {
            throw "Inno Setup produced no *-setup.exe under dist/"
          }
          New-Item -ItemType Directory -Force -Path "out\installers" | Out-Null
          Copy-Item dist\*-setup.exe "out\installers\"
      - uses: actions/upload-artifact@v4
        with:
          name: notorious-${{ matrix.triplet }}
          path: github.com/AMDphreak/notorious/out/${{ matrix.triplet }}/**
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: installer-${{ matrix.triplet }}
          path: github.com/AMDphreak/notorious/out/installers/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Pack archives and promote installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          # First-class installer assets (not nested inside portable zips).
          shopt -s nullglob
          for setup in artifacts/installer-*/*-setup.exe; do
            cp -v "$setup" release-files/
          done
          for d in artifacts/notorious-*; do
            trip=${d##*notorious-}
            (cd "$d" && zip -r "../../release-files/notorious-${trip}.zip" .)
          done
          ls -la release-files
          # Fail the release if Windows built but no setup.exe was promoted.
          if compgen -G 'artifacts/notorious-windows-*' > /dev/null; then
            if ! compgen -G 'release-files/*-setup.exe' > /dev/null; then
              echo "::error::Windows artifacts present but no *-setup.exe in release-files"
              exit 1
            fi
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          name: Notorious ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
