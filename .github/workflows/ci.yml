name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-14
    runs-on: ${{ matrix.os }}
    # macOS windowed not ready (vello Metal / glfw-d Cocoa); keep matrix green for win/lin.
    continue-on-error: ${{ matrix.os == 'macos-14' }}
    defaults:
      run:
        working-directory: github.com/AMDphreak/notorious
    steps:
      - uses: actions/checkout@v4
        with:
          path: github.com/AMDphreak/notorious
      - uses: actions/checkout@v4
        with:
          repository: dlang-supplemental/dew
          path: github.com/dlang-supplemental/dew
      - uses: actions/checkout@v4
        with:
          repository: dlang-supplemental/dui
          path: github.com/dlang-supplemental/dui
      # dew dub.sdl path-pins vello-d for every config validation
      - uses: actions/checkout@v4
        with:
          repository: dlang-supplemental/vello-d
          path: github.com/dlang-supplemental/vello-d
      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest
      # Needed for -c windowed (vello-d cargo preBuild).
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux window system deps (GLFW)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Test
        run: dub test -c unittest --compiler=ldc2
      - name: Build headless
        run: dub build -c application --compiler=ldc2 --build=release
      - name: Smoke
        shell: bash
        run: ./notorious --version || ./notorious.exe --version
      - name: Build windowed
        run: dub build -c windowed --compiler=ldc2 --build=release
